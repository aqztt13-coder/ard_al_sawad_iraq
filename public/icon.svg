<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#0F3D3E" />
  <rect x="28" y="28" width="456" height="456" rx="72" fill="none" stroke="#C89B3C" stroke-width="6" stroke-opacity="0.45" />
  <!-- Eight-pointed Mesopotamian / Islamic star -->
  <g transform="translate(256 256)">
    <polygon points="0,-148 38,-56 136,-56 58,8 88,108 0,50 -88,108 -58,8 -136,-56 -38,-56" fill="none" stroke="#C89B3C" stroke-width="8" stroke-linejoin="round" stroke-opacity="0.35" />
    <!-- Pointed dome arch silhouette -->
    <path d="M 0 -132 C 62 -92 94 -28 94 42 L 94 112 L -94 112 L -94 42 C -94 -28 -62 -92 0 -132 Z" fill="#1B4B72" stroke="#C89B3C" stroke-width="10" stroke-linejoin="round" />
    <!-- Golden inner finial & crescent-star glow -->
    <path d="M 0 -92 C 36 -64 56 -16 56 36 L 56 84 L -56 84 L -56 36 C -56 -16 -36 -64 0 -92 Z" fill="#0F3D3E" stroke="#C89B3C" stroke-width="5" />
    <!-- Twin river wave lines (Tigris & Euphrates) -->
    <path d="M -42 42 Q -21 26 0 42 T 42 42" fill="none" stroke="#C89B3C" stroke-width="6" stroke-linecap="round" />
    <path d="M -36 62 Q -18 48 0 62 T 36 62" fill="none" stroke="#E7C87B" stroke-width="5" stroke-linecap="round" />
    <!-- Star at dome apex -->
    <circle cx="0" cy="-148" r="10" fill="#C89B3C" />
  </g>
</svg>
